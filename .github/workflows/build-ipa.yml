name: Denon Pilot iPhone-IPA erstellen

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-iphone:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Xcode und Umgebung anzeigen
        run: |
          xcodebuild -version
          xcodebuild -list -project DenonPilot.xcodeproj

      - name: Native iOS-App ohne Signierung erstellen
        run: |
          set -euo pipefail
          xcodebuild \
            -project DenonPilot.xcodeproj \
            -scheme DenonPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DenonBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=' \
            clean build

      - name: Unsigned IPA verpacken
        run: |
          set -euo pipefail
          mkdir -p Payload
          test -d "$RUNNER_TEMP/DenonBuild/Build/Products/Release-iphoneos/DenonPilot.app"
          cp -R "$RUNNER_TEMP/DenonBuild/Build/Products/Release-iphoneos/DenonPilot.app" Payload/
          /usr/bin/zip -q -r DenonPilot-unsigned-v0.4.ipa Payload
          test -s DenonPilot-unsigned-v0.4.ipa

      - name: IPA zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: DenonPilot-unsigned-iPhone-v0.4
          path: DenonPilot-unsigned-v0.4.ipa
          retention-days: 7
